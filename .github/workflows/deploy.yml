name: HR System CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug variables
      run: |
        echo "HOST=${{ vars.EC2_HOST }}"
        echo "USER=${{ vars.EC2_USER }}"

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd hr-system-devops || git clone https://github.com/mostafabadie/hr-system-devops.git && cd hr-system-devops
          git pull origin main
          docker compose down || true
          docker compose up -d --build